description = "Search a Dalamud log for a regular expression (case-insensitive, extended regex), newest log first."
safety = "read"
run_on = "local"
timeout = 20
max_output = 20000

[params.pattern]
type = "string"
pattern = "[^\\x00-\\x1f]{1,200}"
allow_dash = true     # passed after -e, so a leading dash is just text
required = true
description = "Extended regular expression, e.g. 'GhosttyDalamud|Exception'."

[params.log]
type = "string"
enum = ["dalamud.log", "dalamud.old.log", "dalamud.boot.log", "dalamud.injector.log", "launcher.log"]
default = "dalamud.log"
description = "Which log file."

[params.max]
type = "integer"
minimum = 1
maximum = 500
default = 50
description = "Stop after this many matching lines."

[[commands]]
argv = ["grep", "-E", "-i", "-n", "-m", "{max}", "-e", "{pattern}", "{@home}/.xlcore/logs/{log}"]
