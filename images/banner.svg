<svg xmlns="http://www.w3.org/2000/svg" width="730" height="380" viewBox="0 0 730 380">
  <title>Almanac for FFXIV: talk to a local AI model in game</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050a1c"/>
      <stop offset="0.6" stop-color="#0e1d45"/>
      <stop offset="1" stop-color="#1b3568"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbeab5"/>
      <stop offset="0.5" stop-color="#d6a854"/>
      <stop offset="1" stop-color="#94682c"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e3"/>
      <stop offset="1" stop-color="#d3c29c"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ecd4"/>
      <stop offset="1" stop-color="#c6b28a"/>
    </linearGradient>
    <linearGradient id="cL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9f6ff"/>
      <stop offset="1" stop-color="#2a8bd3"/>
    </linearGradient>
    <linearGradient id="cR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63cdf7"/>
      <stop offset="1" stop-color="#134a88"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8fe3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4fb0f0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="730" height="380" fill="url(#sky)"/>
  <g fill="#cfe8ff" opacity="0.9">
    <circle cx="48" cy="46" r="2"/><circle cx="120" cy="30" r="1.5"/><circle cx="205" cy="62" r="1.8"/>
    <circle cx="612" cy="40" r="2"/><circle cx="676" cy="96" r="1.6"/><circle cx="540" cy="26" r="1.4"/>
    <circle cx="352" cy="24" r="1.4"/><circle cx="82" cy="120" r="1.4"/>
  </g>

  <!-- the aetheryte crystal, left -->
  <g transform="translate(148,168)">
    <circle r="96" fill="url(#halo)"/>
    <path d="M-92 6 A96 18 0 0 1 92 6" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.9"/>
    <g filter="url(#glow)">
      <path d="M0 -76 L30 -8 L0 48 Z" fill="url(#cR)"/>
      <path d="M0 -76 L-30 -8 L0 48 Z" fill="url(#cL)"/>
    </g>
    <!-- the open almanac under it -->
    <g transform="translate(0,96)">
      <path d="M0 -30 L-108 -8 L-108 62 L0 40 Z" fill="url(#pageL)"/>
      <path d="M0 -30 L108 -8 L108 62 L0 40 Z" fill="url(#pageR)"/>
      <path d="M0 -30 L-108 -8 L-108 62 L0 40 Z" fill="none" stroke="url(#gold)" stroke-width="4"/>
      <path d="M0 -30 L108 -8 L108 62 L0 40 Z" fill="none" stroke="url(#gold)" stroke-width="4"/>
      <path d="M0 -30 L0 40" stroke="#94682c" stroke-width="4"/>
      <g stroke="#7a6a4a" stroke-width="4" stroke-linecap="round">
        <path d="M-88 6 L-22 -6"/><path d="M-88 24 L-22 12"/><path d="M-88 42 L-44 34"/>
        <path d="M22 -6 L88 6"/><path d="M22 12 L88 24"/>
      </g>
      <path d="M22 30 L66 38" stroke="#5cc8f5" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    </g>
  </g>

  <!-- the in-game chat: your question, the model's answer, both on your own machine -->
  <g transform="translate(300,54)">
    <rect x="0" y="0" width="396" height="272" rx="16" fill="#0a1430" fill-opacity="0.92" stroke="url(#gold)" stroke-width="3"/>
    <text x="22" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#f6e2a4">Almanac</text>
    <text x="22" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#9fc4ee">a local model, in game</text>
    <!-- your line -->
    <rect x="128" y="86" width="246" height="46" rx="12" fill="#1c3568"/>
    <g stroke="#bcd8ff" stroke-width="5" stroke-linecap="round" opacity="0.85">
      <path d="M146 104 L336 104"/><path d="M146 118 L280 118"/>
    </g>
    <!-- the model's reply, streaming -->
    <rect x="22" y="146" width="288" height="64" rx="12" fill="#12254c"/>
    <g stroke="#7fdcff" stroke-width="5" stroke-linecap="round" opacity="0.9">
      <path d="M40 166 L272 166"/><path d="M40 182 L232 182"/><path d="M40 198 L160 198"/>
    </g>
    <rect x="170" y="190" width="9" height="16" rx="2" fill="#bff4ff" filter="url(#glow)"/>
    <!-- the tools it is allowed to call -->
    <g transform="translate(22,226)" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#cfe8ff">
      <rect x="0" y="0" width="112" height="28" rx="14" fill="#16305c" stroke="#3d6ba8"/>
      <text x="16" y="19">XivMcp tools</text>
      <rect x="124" y="0" width="96" height="28" rx="14" fill="#16305c" stroke="#3d6ba8"/>
      <text x="140" y="19">your GPU</text>
      <rect x="230" y="0" width="98" height="28" rx="14" fill="#16305c" stroke="#3d6ba8"/>
      <text x="246" y="19">no cloud</text>
    </g>
  </g>
</svg>
