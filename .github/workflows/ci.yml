# Every push and pull request: the Dalamud plugin's manifest check, build, tests and
# packaging. Nothing here needs the game.
#
# Where it runs: the owner's own runs (pushes, pull requests from this
# repository's branches, manual runs) go to the fedora build host, where ci-dispatchd boots
# a one-shot, network-isolated container from the ci-runner-dalamud image (.NET 10
# SDK and the current Dalamud reference assemblies already in it) for this one job
# and destroys it afterwards. A run anyone else starts (collaborators, Dependabot),
# a pull request from a fork, or any run inside a fork goes to GitHub's ubuntu-latest instead: a self-hosted runner executes whatever the
# workflow file says, and a fork's pull request can rewrite it. The dispatcher
# refuses fork pull requests on its own as well. Setting the repository variable
# CI_SELF_HOSTED to "false" sends every run to ubuntu-latest (the build host is
# down, say). The Python engine has its own tests (`make test`,
# README) which are not wired up here yet.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dalamud:
    name: Dalamud plugin
    runs-on: >-
      ${{ (vars.CI_SELF_HOSTED == 'false'
            || github.actor != github.repository_owner
            || github.triggering_actor != github.repository_owner
            || github.event.repository.fork
            || (github.event_name == 'pull_request'
                && github.event.pull_request.head.repo.full_name != github.repository))
          && 'ubuntu-latest'
          || fromJSON('["self-hosted","almanac-dalamud","fedora-dalamud"]') }}
    timeout-minutes: 30
    env:
      DALAMUD_HOME: ${{ github.workspace }}/.dalamud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The self-hosted image already has a .NET 10 SDK; install one only when missing.
      - name: Probe for the .NET SDK
        id: dotnet
        run: |
          if command -v dotnet >/dev/null && dotnet --list-sdks | grep -q '^10\.'; then
            echo "have=true" >>"$GITHUB_OUTPUT"
          else
            echo "have=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Install the .NET SDK
        if: steps.dotnet.outputs.have != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Check that CHANGELOG.md matches changelog.json
        run: tools/changelog.py --check

      - name: Check the plugin manifest
        run: dalamud/tools/check-manifest.py

      # The self-hosted image carries the current Dalamud release; dalamud-seed copies
      # it into DALAMUD_HOME only while it is still the live one, else does nothing.
      - name: Seed the Dalamud reference assemblies from the runner image
        run: if command -v dalamud-seed >/dev/null; then dalamud-seed "$DALAMUD_HOME"; fi

      - name: Fetch the Dalamud reference assemblies
        run: dalamud/tools/fetch-dalamud.sh

      - name: Test
        run: dotnet test dalamud/tests/Almanac.Core.Tests -c Release

      - name: Build
        run: dotnet build dalamud/src/Almanac.Plugin/Almanac.Plugin.csproj -c Release

      - name: Package (the release path, run on every push)
        env:
          OUT: ${{ runner.temp }}/release
        run: dalamud/tools/package.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: almanac-plugin-${{ github.sha }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 14
