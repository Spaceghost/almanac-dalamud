# What tools/release.sh and tools/releasekit.py need to know about this repository.
# KEY=value, one per line; lists are space separated (CI_WORKFLOWS: comma separated).
NAME=Almanac
INTERNAL_NAME=Almanac
REPO=Spaceghost/almanac-dalamud
MANIFEST=dalamud/src/Almanac.Plugin/Almanac.json
# files that carry the four-part version (X.Y.Z.N), and the three-part one (X.Y.Z)
VERSION_FILES=dalamud/src/Almanac.Plugin/Almanac.json dalamud/Directory.Build.props
BASE_VERSION_FILES=pyproject.toml src/almanac/__init__.py
CHANGELOG_TOOL=tools/changelog.py
CHANGELOG_FILES=changelog.json CHANGELOG.md
BANNER=images/banner.png
SITE=https://spacegho.st/mods/ffxiv/almanac/
# workflows that must be green on the commit being released
CI_WORKFLOWS=CI, Python
# run after the version is written, before anything is committed
CHECK=dalamud/tools/check-manifest.py
